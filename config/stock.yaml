# 1. Cấu hình Dữ liệu (Yahoo Finance)
data:
  ticker: "AAPL"                     # Mã cổ phiếu mặc định (Apple)
  benchmark_ticker: "^GSPC"          # DOCUMENTATION ONLY — không được tải trong code;
                                       # Benchmark_Return% trong backtest = Buy&Hold trên chính ticker đang test (không phải ^GSPC)

  # Danh sách các mã cổ phiếu sẽ được train (Multi-Ticker Experiment)
  training_tickers:
    - "AAPL"
    - "TSLA"
    - "MSFT"
    - "AMZN"
    - "NVDA"
    - "GOOGL"
    - "ORCL" 
    - "IBM"
    - "INTC"
    - "META"
    - "JPM"
    - "BAC"
    - "MA"
    - "MCD"
    - "NKE"
    - "KO"
    - "PEP"
    - "COST"
    - "LLY"
    - "JNJ"
    - "ABBV"

  # Danh sách seeds để chạy multi-seed experiment (đảm bảo tính ổn định của thuật toán)
  training_seeds:
    - 42
    - 100

  macro_tickers:                     # Các chỉ số vĩ mô trên Yahoo Finance để mô hình có "ngữ cảnh" thị trường
    - "^VIX"                         # Chỉ số biến động (Chỉ số sợ hãi). VIX cao thường đi kèm thị trường giảm.
    - "^TNX"                         # Lợi suất trái phiếu chính phủ Mỹ kỳ hạn 10 năm. Lãi suất tăng thường gây áp lực lên cổ phiếu công nghệ như AAPL.
  start_date: "2018-01-01"           
  end_date: "2026-12-31"            
  cache_dir: "data"                 
  target_col: "Log_Return"                                    
  use_log_return: true

  # Jittering Augmentation 
  use_augmentation: true             
  noise_std: 0.002                  
  n_augmented: 2                  

# 2. Cấu hình Cửa sổ Chuỗi Thời Gian
# window (cửa sổ trượt): là một "khung nhìn" chứa N ngày quá khứ, được dùng để dự đoán N_out ngày tương lai. Về bản chất, nó là kích thước bộ nhớ của mô hình.
window:
  input_window: 60                   # Số ngày quá khứ gần nhất đưa vào mô hình (Lookback window = 60 phiên)
  forecast_horizon: 1                # Số ngày tương lai cần dự báo (1 ngày cho v0/v1/v2, 7 ngày cho v3)
  multi_step_horizon: 7              # Số ngày tương lai cho bài toán mở rộng (v3)

# 3. Phân tách Dữ liệu (Purged Time-Series Split)
# Purged Time-Series Split: pp chia theo trình tự thời gian để tránh lỗi data leakage
split:
  train_ratio: 0.70                  # 70% dữ liệu huấn luyện
  val_ratio: 0.15                    # 15% dữ liệu kiểm chuẩn
  test_ratio: 0.15                   # 15% dữ liệu kiểm thử thực tế (Out-of-sample)
                                     # DOCUMENTATION ONLY — không được đọc trong code;
                                     # test_df = phần còn lại sau train+val (tránh rounding gap)

# 4. Cấu hình Phiên bản Mô hình (Ablation Study Versions)
# v0: Dữ liệu giá thô (OHLCV) + Vanilla LSTM / Vanilla CNN1D
# v1: Dữ liệu làm giàu 20+ Chỉ báo Kỹ thuật + Deep LSTM / Deep CNN1D
# v2: Proposed SOTA (CNN-BiLSTM-MultiHead-Attention)
# v3: Multi-step Seq2Seq with Attention
model:
  active_version: "v0"               # DOCUMENTATION ONLY — không được đọc trong code;
                                     # version được truyền qua CLI argument --version
  
  # Cấu hình kiến trúc
  # Giảm 80% tham số — 1170 mẫu train không đủ cho model cũ (~250k params)
  # Tham số/mẫu thực tế (hidden_dim=32, num_layers=2, aug x3): ~12 (raw) / ~4 (aug) — an toàn với dropout=0.2
  lstm:
    hidden_dim: 32                   # Giảm 64→32: giảm 75% params BiLSTM, tránh memorize 1170 mẫu train
    num_layers: 2                    # DeepLSTM (v1) CẦN 2 tầng để thực sự "deep" hơn VanillaLSTM (v0=1 tầng)
                                     # params/mẫu (sau aug x3): 14,433/3,510 = 4.1 — an toàn với dropout=0.2
    dropout: 0.2                     # Giảm 0.35→0.2: tránh over-regularization với dataset nhỏ
  
  cnn1d:
    num_filters: 32                  # Giảm 64→32 filters
    kernel_size: 3                   # Kích thước kernel (quét qua từng cụm 3 ngày liên tiếp)
    dropout: 0.2                     # Giảm 0.35→0.2: nhất quán với lstm
    
  cnn_bilstm_attention:
    cnn_filters: 32                  # Giảm 64→32: −75% params CNN
    kernel_size: 3                   # Kích thước kernel CNN
    lstm_hidden: 32                  # Giảm 64→32: BiLSTM 32×2=64 chiều (thay vì 128)
    num_heads: 2                     # Giảm 4→2 heads: −75% params Attention
    dropout: 0.2                     # Giảm 0.35→0.2: nhất quán với lstm

  seq2seq:                           # Dành cho dự báo nhiều ngày - Multi-step
    hidden_dim: 32                   # Giảm 64→32
    dropout: 0.2                     # Giảm 0.35→0.2: nhất quán với lstm

# 5. Cấu hình Huấn Luyện 
training:
  batch_size: 32
  epochs: 100                     
  learning_rate: 0.001             
  weight_decay: 0.0001              # Giảm 0.001→0.0001: về Adam default, tránh L2 quá mạnh gây model collapse
  loss_type: "huber"                # SmoothL1Loss — ổn định hơn DirectionalPenaltyLoss với dataset nhỏ
                                    # Đổi thành "directional" để bật DirectionalPenaltyLoss (phạt sai chiều xu hướng)
                                    # Loss = Huber(ŷ,y) + penalty_weight × max(0, −sign(y−zero_point)×(ŷ−zero_point))
  directional_penalty_weight: 0.5   # Chỉ có hiệu lực khi loss_type="directional"
  early_stopping_patience: 15       # Tăng 10→15: cho model đủ thời gian hưởng lợi từ ReduceLROnPlateau
                                     # scheduler_patience=5 (giảm LR) + ~10 epoch để val_loss ổn định tại LR mới
  checkpoint_dir: "checkpoints"
  device: "auto"
  teacher_forcing_ratio: 0.5         # Xác suất dùng nhãn thật tại bước t (chỉ cho Seq2Seq v3)
                                     # 0.0 = tắt hoàn toàn, 1.0 = luôn dùng nhãn thật
  teacher_forcing_decay: 0.95        # Hệ số decay sau mỗi epoch (0.95 → ~0 sau ~80 epochs)

# 6. Cấu hình Kiểm định Tài chính & Backtesting (Trading Simulation)
# Backtesting: Mô phỏng lại quá trình giao dịch để đánh giá hiệu quả của mô hình
backtest:
  initial_capital: 100000.0          # Vốn khởi điểm $100,000
  commission_fee: 0.001              # Phí giao dịch 0.1% mỗi chiều
  slippage: 0.0005                   # Trượt giá 0.05%
  signal_threshold: 0.0005           # Nguong tin hieu MUA: predicted return > 5 bps (0.05%)
                                     # Muc dich ablation study: threshold thap -> nhieu lenh -> Sharpe co y nghia thong ke
                                     # Cost chi tinh khi DOI vi the (khong phai moi ngay): hold 5 ngay chi mat 30bps/5=6bps/ngay
                                     # => 5 bps hop le neu model giu position nhieu ngay lien tiep
  risk_free_rate: 0.04               # Lãi suất phi rủi ro 4%/năm (chuẩn US Treasury)
